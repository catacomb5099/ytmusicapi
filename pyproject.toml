[project]
name = "ytmusic-adapter"
version = "0.1.0"
description = "Stateless FastAPI adapter exposing ytmusicapi as a read-only JSON API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "gunicorn>=23,<24",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "ytmusicapi==1.12.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
]

[tool.pytest.ini_options]
markers = [
    "live: hits the real YouTube Music backend, opt-in only",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI's Depends(...) in a default argument is the documented, idiomatic pattern.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
