name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Catches YouTube response-shape drift even when nobody is pushing code.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  lint-and-offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest

  live-contract-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run pytest -m live
